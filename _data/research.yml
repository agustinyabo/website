- title: Control of gene regulatory networks
  type: axis
  text: '<p>Gene regulatory networks can be approximated by piecewise-linear models, which capture switch-like behaviours such as bistability and oscillations while remaining amenable to mathematical analysis.</p><p>We study optimal control problems on these hybrid systems, such as time-optimal and L¹-optimal state transitions, to understand how an external inducer can drive a network from one regime to another: switching a bistable toggle switch, or changing the oscillation regime of the p53–Mdm2 network. The results characterize the structure of optimal controls, the role of separatrices and abnormal extremals, and lead to feedback control laws.</p>'
  image: research/gene-networks.jpg
  figure_from:
