- title: Modelling and control of wine fermentation
  type: axis
  text: <p>Wine fermentation is a bioprocess where control can improve product quality while reducing energy consumption. Together with colleagues at MISTEA and the SPO and Pech Rouge units, we develop mechanistic models of yeast metabolism and aroma synthesis, such as the production of isoamyl acetate.</p><p>Building on these models, we work on the multiobjective optimization of temperature profiles that balance aroma production and energy consumption, with the goal of real-time control of industrial fermentations.</p>
  image: research/wine-model.jpg
  figure_from:
    title: A parsimonious mechanistic model of aroma synthesis during wine fermentation
    link: https://hal.science/hal-05771433
