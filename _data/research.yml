- type: text
  contents: <p>My research focuses on <b>control theory and its applications to life sciences</b>. I resort to theoretical and numerical optimal control approaches to predict biological phenomena, such as regulatory mechanisms in bacterial cells or transitions in gene regulatory networks, and to develop control strategies for industrial and biotechnological processes, such as wine fermentation. My work is organized around the three axes below.</p>
  plain: true
- title: Optimal resource allocation in microbial growth
  type: axis
  text: <p>Bacteria continuously redistribute their protein synthesis capacity among metabolic enzymes, ribosomes and other cellular functions. Using coarse-grained self-replicator models, I formulate this allocation as an optimal control problem and study its solutions analytically and numerically.</p><p>This framework helps explain natural behaviours such as growth laws, diauxic growth on multiple substrates or the response to heat shock, and suggests synthetic strategies to maximize the production of metabolites of interest in batch, fed-batch and continuous bioreactors.</p>
