- title: Research projects
  type: projects
  contents:
    - name: AI-HERBAGE
      funder: PEPR AgroEcoNum
      period: 2026 – 2031
      description: Artificial Intelligence for the Holistic Efficiency of Rangeland in terms of Breeding Animals and Grassland Exploitation.
      role: Participant
      partners: [Eco&Sols, MISTEA, TETIS, SELMET, Inria Thoth, Herbivores, LIMOS, La Fage, Gipsa-lab]

    - name: SingleCell
      funder: INRAE MathNum
      period: 2026
      description: Stochastic and deterministic single-cell models, with application to alcoholic fermentation.
      role: Co-leader (with B. Cloez)
      lead: true

    - name: DigitWine
      funder: ANR
      period: 2025 – 2029
      description: Multiobjective optimization of wine fermentation quality and energy footprint.
      role: Work package leader (real-time control)
      lead: true
      partners: [SayFood, AgroParisTech, MISTEA, MIA Paris, SPO, Pech Rouge]
      link: https://anr.fr/Projet-ANR-24-CE10-4479

    - name: NyLoops
      funder: INRAE MathNum
      period: 2025 – 2026
      description: Feedback loops in biological systems.
      role: Project leader
      lead: true

    - name: StarWine
      funder: ANR
      period: 2019 – 2023
      description: Real-time control of aroma synthesis in wine fermentation.
      role: Participant
      partners: [SPO, GMPA, LISBP, MISTEA, Pech Rouge]
      link: https://anr.fr/Projet-ANR-18-CE10-0013

    - name: Maximic
      funder: ANR
      period: 2017 – 2021
      description: Optimal control of microbial cells by natural and synthetic strategies.
      role: Member
      link: https://project.inria.fr/maximic/project/

