# Local preview: `docker compose up`, then open http://localhost:8080/website/
# Uses Ruby 3.2 (same as the GitHub deploy workflow); gems are cached in a named volume.
services:
  jekyll:
    image: ruby:3.2
    working_dir: /srv/jekyll
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq imagemagick > /dev/null &&
      bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload --force_polling"
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - website-gems:/usr/local/bundle

volumes:
  website-gems:
    name: website-gems
